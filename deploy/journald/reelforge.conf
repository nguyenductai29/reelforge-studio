# Journal size limits for the home server (Phase 25). Every ReelForge service logs to the journal (JSON lines).
# Install: sudo mkdir -p /etc/systemd/journald.conf.d && sudo cp deploy/journald/reelforge.conf /etc/systemd/journald.conf.d/
#          sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=2G
SystemKeepFree=4G
MaxRetentionSec=1month
