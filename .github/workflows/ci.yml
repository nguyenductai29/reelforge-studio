name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  postgres:
    # The same suite against PostgreSQL: row locks (FOR UPDATE / SKIP LOCKED), ON CONFLICT upserts, payment
    # settlement, the credit ledger, workspace isolation, concurrent quota and checkout, job claiming, every
    # migration in both directions, and the backup → restore rehearsal with pg_dump / pg_restore.
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelforge_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REELFORGE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reelforge_ci_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL client tools (pg_dump / pg_restore, version 16 or newer)
        run: |
          if ! ls /usr/lib/postgresql/*/bin/pg_dump >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          echo "REELFORGE_TEST_PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Run backend tests on PostgreSQL
        run: python -m unittest discover -s tests -v

  migrations:
    name: Alembic (upgrade, check, downgrade, upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelforge_ci_migrations_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # No instance/bootstrap.json in a checkout: the variable names the database.
      REELFORGE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reelforge_ci_migrations_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Upgrade to head
        run: python -m alembic upgrade head
      - name: Models match the migrations
        run: python -m alembic check
      - name: Downgrade to base and upgrade again
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    # Browser tests of the critical flows (e2e/README.md) on a disposable stack: the API and the built frontend
    # from this commit, PostgreSQL, and a local SMTP sink. No AI provider, payment gateway or social network is
    # contacted.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelforge_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reelforge_e2e_test
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Build the disposable stack
        run: python e2e/prepare.py
      - name: Run the browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
