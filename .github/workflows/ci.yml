name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Supported versions (docs/home-server-deployment.md): Python 3.11 or newer, the home server runs 3.14; Node.js 20.9 or
# newer (20 is end-of-life since April 2026; 22 is the LTS to use). No job needs a secret, and no job can reach a paid
# provider: the live tests run only with REELFORGE_LIVE_TESTS=1, which CI never sets.

jobs:
  backend:
    name: Backend tests (SQLite, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: FFmpeg (the movie pipeline test renders a real 40-second movie)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run backend tests
        shell: bash  # with pipefail: tee must not hide a failing run
        env:
          REELFORGE_REQUIRE_FFMPEG: '1'
        run: python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Show failing tests as annotations (readable without access to the log)
        if: failure()
        run: python tests/ci_annotate.py unittest.log

  postgres:
    # The same suite against PostgreSQL: row locks (FOR UPDATE / SKIP LOCKED), ON CONFLICT upserts, payment
    # settlement, the credit ledger, workspace isolation, concurrent quota and checkout, job claiming, every
    # migration in both directions, and the backup → restore rehearsal with pg_dump / pg_restore.
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelforge_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      REELFORGE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reelforge_ci_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL client tools (pg_dump / pg_restore, version 16 or newer)
        run: |
          if ! ls /usr/lib/postgresql/*/bin/pg_dump >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          echo "REELFORGE_TEST_PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: FFmpeg (the movie pipeline test renders a real 40-second movie)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run backend tests on PostgreSQL
        shell: bash  # with pipefail: tee must not hide a failing run
        env:
          REELFORGE_REQUIRE_FFMPEG: '1'
        run: python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Show failing tests as annotations (readable without access to the log)
        if: failure()
        run: python tests/ci_annotate.py unittest.log

  migrations:
    name: Alembic (upgrade, check, downgrade, upgrade)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelforge_ci_migrations_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # No instance/bootstrap.json in a checkout: the variable names the database.
      REELFORGE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reelforge_ci_migrations_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Upgrade to head
        run: python -m alembic upgrade head
      - name: Models match the migrations
        run: python -m alembic check
      - name: Downgrade to base and upgrade again
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend typecheck and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    # Browser tests of the critical flows (e2e/README.md) on a disposable stack: the API and the built frontend
    # from this commit, PostgreSQL, a local SMTP sink and an in-memory Google Drive (tests/fake_drive.py). No AI
    # provider, payment gateway, social network or Google service is contacted.
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reelforge_e2e_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reelforge_e2e_test
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          (cd frontend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)
      - name: Build the disposable stack
        run: python e2e/prepare.py
      - name: Run the browser tests
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
