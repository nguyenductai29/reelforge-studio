<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReelForge Studio</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8edf7;background:#10131b}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{background:#9065f7;color:white;border:0;padding:11px 16px;border-radius:10px;cursor:pointer}button:hover{background:#a787ff}input,textarea{background:#1c2330;border:1px solid #394154;color:#fff;border-radius:9px;padding:11px;width:100%}textarea{min-height:90px}label{display:block;margin:12px 0 5px;color:#aeb9ca;font-size:13px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{background:#171c27;padding:24px;border-right:1px solid #303747}aside h2{color:#bb9aff;margin:0 0 32px}nav button{display:block;background:transparent;text-align:left;width:100%;margin:4px 0;color:#aeb9ca}nav button.active,nav button:hover{background:#30324e;color:#fff}main{padding:38px;max-width:1250px;width:100%}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:#1b2230;border:1px solid #30394b;border-radius:14px;padding:20px;margin:15px 0}.card strong{font-size:27px;color:#c3aaff}.muted{color:#aeb9ca}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.auth{max-width:440px;margin:12vh auto;padding:32px}.hidden{display:none}#error{color:#ff9ba2;min-height:22px}a{color:#c3aaff}.pill{background:#35405a;border-radius:18px;padding:5px 10px;font-size:12px}form{max-width:520px}.item{border-bottom:1px solid #354052;padding:13px 0}.item:last-child{border:0}small{color:#98a4b6}
</style></head><body>
<section id="auth" class="card auth"><h1>ReelForge Studio</h1><p class="muted" id="auth-description"></p><form id="auth-form"><label>Email</label><input name="email" type="email" required autocomplete="username"><label>Mật khẩu</label><input name="password" type="password" required autocomplete="current-password"><p><button id="auth-submit"></button></p></form><p id="auth-error"></p></section>
<div id="app" class="shell hidden"><aside><h2>✦ ReelForge</h2><nav id="nav"><button data-page="dashboard" class="active">Tổng quan</button><button data-page="projects">Dự án</button><button data-page="library">Kho media</button><button data-page="workflows">Workflow</button><button data-page="settings">Cài đặt</button></nav><p class="muted">Studio của bạn</p><button id="logout">Đăng xuất</button></aside><main><div class="top"><div><h1 id="page-title">Tổng quan</h1><span class="muted" id="studio-name"></span></div><span class="pill" id="plan"></span></div><p id="error"></p><div id="content"></div></main></div>
<script>
let state=null,page='dashboard',setup=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch('/api/'+path,{credentials:'same-origin',...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||`HTTP ${r.status}`);return d}
function showError(e){$('#error').textContent=e.message||String(e)}
async function refresh(){try{state=await api('dashboard');$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#studio-name').textContent=state.workspace.name;$('#plan').textContent=state.workspace.plan.toUpperCase();render()}catch(e){if(e.message==='Please sign in'){const s=await api('status');setup=s.setup_required;$('#auth-description').textContent=setup?'Tạo tài khoản quản trị đầu tiên':'Đăng nhập để quản lý studio';$('#auth-submit').textContent=setup?'Tạo studio':'Đăng nhập';$('#auth').classList.remove('hidden');$('#app').classList.add('hidden')}else showError(e)}}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api(setup?'setup':'login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});$('#auth-error').textContent='';await refresh()}catch(err){$('#auth-error').textContent=err.message}};
$('#logout').onclick=async()=>{await api('logout',{method:'POST'});await refresh()};
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()}};
function render(){const titles={dashboard:'Tổng quan',projects:'Dự án',library:'Kho media',workflows:'Workflow',settings:'Cài đặt'};$('#page-title').textContent=titles[page];$('#error').textContent='';const c=$('#content');
if(page==='dashboard')c.innerHTML=`<div class="grid"><div class="card">Dự án<br><strong>${state.projects.length}</strong></div><div class="card">Media<br><strong>${state.assets.length}</strong></div><div class="card">Workflow<br><strong>${state.workflows.length}</strong></div><div class="card">Gói hiện tại<br><strong>${esc(state.workspace.plan)}</strong></div></div><div class="card"><h3>Luồng tạo video</h3><p class="muted">Ý tưởng → Kịch bản → Cảnh → Media → Giọng đọc → Render → Duyệt → Đăng tải</p><p>Giai đoạn này hỗ trợ tổ chức dự án và media. Bộ tạo, render và đăng tải đang nằm trong lộ trình tiếp theo.</p></div>`;
if(page==='projects')c.innerHTML=`<div class="card"><h3>Tạo dự án</h3><form id="project-form"><label>Tên dự án</label><input name="title" required maxlength="150"><label>Chủ đề</label><textarea name="topic" maxlength="3000"></textarea><p><button>Tạo dự án</button></p></form></div><div class="card"><h3>Danh sách dự án ${state.limits.projects===null?'':`(${state.projects.length}/${state.limits.projects} Trial)`}</h3>${state.projects.map(p=>`<div class="item"><b>${esc(p.title)}</b> <span class="pill">${esc(p.status)}</span><p class="muted">${esc(p.topic)}</p></div>`).join('')||'<p class="muted">Chưa có dự án.</p>'}</div>`;
if(page==='library')c.innerHTML=`<div class="card"><h3>Tải media</h3><form id="upload-form"><label>Ảnh, video hoặc âm thanh (tối đa 100 MB)</label><input type="file" name="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,audio/mpeg,audio/wav,audio/ogg" required><p><button>Tải lên</button></p></form></div><div class="card"><h3>Kho media</h3>${state.assets.map(a=>`<div class="item"><a href="/api/assets/${encodeURIComponent(a.id)}">${esc(a.filename)}</a> <small>${esc(a.content_type)} · ${(a.bytes/1048576).toFixed(2)} MB</small></div>`).join('')||'<p class="muted">Chưa có media.</p>'}</div>`;
if(page==='workflows')c.innerHTML=`<div class="card"><h3>Tạo workflow mẫu</h3><form id="workflow-form"><label>Tên workflow</label><input name="name" required maxlength="150"><p><button>Tạo workflow</button></p></form></div><div class="card"><h3>Workflow</h3>${state.workflows.map(w=>`<div class="item"><b>${esc(w.name)}</b><p class="muted">${w.steps.map(esc).join(' → ')}</p></div>`).join('')||'<p class="muted">Chưa có workflow.</p>'}<small>Workflow hiện lưu cấu trúc để chuẩn bị cho engine; chưa thực thi tự động.</small></div>`;
if(page==='settings')c.innerHTML=`<div class="card"><h3>Workspace</h3><p>ID: <code>${esc(state.workspace.id)}</code></p><p>Gói: ${esc(state.workspace.plan)}</p><p class="muted">Thanh toán, kết nối AI và tài khoản mạng xã hội sẽ có trong các giai đoạn sau. Không nhập API key vào kho media.</p></div>`;
}
document.addEventListener('submit',async e=>{const id=e.target.id;if(!['project-form','workflow-form','upload-form'].includes(id))return;e.preventDefault();try{let f=new FormData(e.target);if(id==='upload-form')await api('assets',{method:'POST',body:f});else await api(id==='project-form'?'projects':'workflows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});await refresh()}catch(err){showError(err)}});
refresh();
</script></body></html>
